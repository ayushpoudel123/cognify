services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: cognify_user
      POSTGRES_PASSWORD: cognify_password
      POSTGRES_DB: cognify_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognify_user -d cognify_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - cognify_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cognify.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cognify_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cognify_user
      DB_PASSWORD: cognify_password
      DB_NAME: cognify_db
      JWT_SECRET: cognify_jwt_secret_key_2026_super_secure
      JWT_REFRESH_SECRET: cognify_jwt_refresh_secret_key_2026
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cognify_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    depends_on:
      - backend
    networks:
      - cognify_network

networks:
  cognify_network:
    driver: bridge

volumes:
  postgres_data:
